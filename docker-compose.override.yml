# Development overrides for docker-compose.yml
# Use: docker compose -f docker-compose.yml -f docker-compose.override.yml up

services:
  dicom-mwl-mpps:
    environment:
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=development
    volumes:
      # Source is mounted by the base file. Restart this container to load edits.
      - ./config.py:/app/config.py:ro
    hostname: dicom-mwl-mpps
    networks:
      default:
        aliases:
          - dicom-server
          - mwl-mpps-server

  mwl-api:
    environment:
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=development
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
    volumes:
      # Edits under docker/mwl-api are reloaded by uvicorn.
      - ./docker/mwl-api:/app
      - ./config.py:/app/config.py:ro
    hostname: mwl-api
    networks:
      default:
        aliases:
          - api-server
          - mwl-api-server

  mysql_db:
    environment:
      - MYSQL_GENERAL_LOG=1
      - MYSQL_GENERAL_LOG_FILE=/var/lib/mysql/general.log
    ports:
      - "3306:3306"
    # Add mysql command for better development experience
    command: --general-log=1 --general-log-file=/var/lib/mysql/general.log
    hostname: mysql_db
    networks:
      default:
        aliases:
          - database
          - mysql-server

  # Add a test runner service for integration tests
  test-runner:
    build:
      context: .
      dockerfile: docker/mwl-mpps/Dockerfile
    container_name: test-runner
    hostname: test-runner
    environment:
      - DB_HOST=mysql_db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=orthanc_ris
      - ENVIRONMENT=test
    depends_on:
      - mysql_db
      - dicom-mwl-mpps
      - mwl-api
    volumes:
      - ./docker/mwl-mpps:/app
    command: python -m pytest tests/ -v
    profiles:
      - test
    networks:
      default:
        aliases:
          - test-client

# Define explicit network for better control
networks:
  default:
    driver: bridge
    name: dicom-mwl-mpps-network 