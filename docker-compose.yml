services:
  ################
  # DICOM MWL MPPS Service, Experimental
  ################
  dicom-mwl-mpps:
    build:
      context: .
      dockerfile: docker/mwl-mpps/Dockerfile
    container_name: dicom-mwl-mpps
    ports:
      - "4104:104"  # Expose DICOM port 104 on host as 4104
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - WORKLIST_DIR=${WORKLIST_DIR}
    depends_on:
      mysql_db:
        condition: service_healthy
    volumes:
      - ./worklist:/worklist
      - ./docker/mwl-mpps:/app
      - ./config.py:/app/config.py:ro

  ################
  # MySQL Database Service
  ################
  mysql_db:
    # Pin the Innovation release already initialized in mysql_data.
    # mysql:latest tracks this line and will move on the next Innovation release.
    # Current LTS is mysql:9.7.4; switching to it needs a new data volume.
    image: mysql:26.10.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init/orthanc_ris.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./mysql-init/dicom_tags_short_names.sql:/docker-entrypoint-initdb.d/02-dicom_tags.sql


  ################
  # MWL API Service
  ################
  mwl-api:
    build:
      context: .
      dockerfile: docker/mwl-api/Dockerfile
    container_name: mwl-api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - WORKLIST_DIR=${WORKLIST_DIR}
    depends_on:
      mysql_db:
        condition: service_healthy
    volumes:
      - ./worklist:/worklist
      - ./config.py:/app/config.py:ro

volumes:
  mysql_data: